<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock</title>

<!-- PWA: instalable en el celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16305c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock DP">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
  :root{
    --azul-osc: #16305c;
    --azul: #2a5cc9;
    --azul-suave: #eef3fc;
    --azul-borde: #d7e2f5;
    --ambar: #b5651d;
    --fondo: #f4f7fc;
    --linea: #e7ecf5;
    --verde: #1f8a4c;
    --rojo: #c0392b;
    --texto-tenue: #7c8aa3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--fondo);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#1a1f2b;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    max-width:520px; margin:0 auto;
    background:var(--fondo);
  }

  /* Header */
  header{
    padding:18px 20px 4px;
    flex-shrink:0;
  }
  header .top-row{
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  header h1{
    font-size:27px; margin:0; color:#111624; font-weight:800;
    letter-spacing:-0.4px;
  }
  header .sub{
    font-size:14px; color:var(--azul); font-weight:700; margin-top:4px;
    letter-spacing:0.2px;
  }
  .icon-btn{
    background:#fff; border:1px solid var(--azul-borde); padding:11px; cursor:pointer;
    color:var(--azul); display:flex; align-items:center; justify-content:center;
    border-radius:12px; box-shadow:0 1px 2px rgba(22,48,92,0.06);
  }
  .icon-btn.logout{ color:var(--rojo); }
  .icon-btn:active{ background:var(--azul-suave); }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.spinning svg{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Pill tabs */
  .pill-tabs{
    display:flex; gap:4px;
    background:#fff; border:1px solid var(--azul-borde);
    border-radius:14px; padding:4px;
    margin:14px 20px 0;
    flex-shrink:0;
    box-shadow:0 1px 3px rgba(22,48,92,0.05);
  }
  .pill-tabs button{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:11px 8px; border-radius:11px;
    font-size:15px; font-weight:700; color:var(--texto-tenue);
    transition:background .15s, color .15s;
  }
  .pill-tabs button.active{
    background:var(--azul); color:#fff;
    box-shadow:0 2px 6px rgba(42,92,201,0.35);
  }

  /* Search */
  .search-wrap{ padding:12px 20px 6px; flex-shrink:0; }
  .search-wrap input{
    width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--azul-borde);
    background:#fff; font-size:16px; outline:none; color:#1a1f2b;
  }
  .search-wrap input:focus{ border-color:var(--azul); }
  .search-wrap input::placeholder{ color:#a7b2c6; }

  /* Content */
  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 20px 24px; }
  /* En la pestaña Movimientos, main deja de scrollear: la tabla scrollea sola
     (así el encabezado puede quedar fijo con position:sticky) */
  main.grid-mode{
    display:flex; flex-direction:column; overflow:hidden; padding-bottom:12px;
  }
  main.grid-mode .mov-table-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; }

  .state-msg{ padding:40px 20px; text-align:center; color:var(--texto-tenue); font-size:14px; }
  .state-msg.error{ color:var(--rojo); }

  /* Tabla Stock Actual */
  .stock-table-wrap{
    border:1px solid var(--linea); border-radius:14px; overflow:hidden;
    background:#fff; box-shadow:0 1px 2px rgba(22,48,92,0.04);
  }
  table.stock{ border-collapse:collapse; width:100%; }
  table.stock td{
    padding:9px 12px; border-bottom:1px solid var(--linea); vertical-align:middle;
  }
  table.stock tr:last-child td{ border-bottom:none; }
  table.stock tr:nth-child(even){ background:#fafbfd; }
  table.stock td.prod{ font-size:16px; font-weight:700; color:#1a1f2b; }
  table.stock td.stock{ font-size:16px; font-weight:800; color:#1a1f2b; text-align:center; width:92px; white-space:nowrap; }
  table.stock td.fecha{ font-size:13.5px; font-weight:600; color:var(--azul-osc); text-align:center; width:80px; white-space:nowrap; }
  table.stock th{
    text-align:left; font-size:12.5px; font-weight:800; color:var(--texto-tenue);
    text-transform:uppercase; letter-spacing:0.3px;
    padding:9px 12px; border-bottom:1.5px solid var(--linea);
    background:#fafbfd;
  }
  table.stock th.stock{ text-align:center; width:92px; }
  table.stock th.fecha{ text-align:center; width:80px; }

  /* Lista Movimientos */
  /* Tabla Movimientos */
  .mov-table-wrap{
    border:1.5px solid var(--azul); border-radius:14px; overflow:hidden;
    background:#fff; box-shadow:0 1px 3px rgba(22,48,92,0.08);
  }
  .mov-scroll{
    overflow:auto; -webkit-overflow-scrolling:touch;
  }
  table.mov{ border-collapse:separate; border-spacing:0; width:100%; min-width:800px; }
  table.mov th{
    position:sticky; top:0; background:#fff; z-index:1;
    text-align:left; font-size:16px; color:#1a1f2b; font-weight:800;
    padding:14px 18px; border-bottom:2px solid var(--azul); white-space:nowrap;
    box-shadow:0 2px 4px rgba(22,48,92,0.15);
  }
  table.mov td{
    padding:14px 18px; font-size:16.5px; white-space:nowrap;
    border-bottom:1px solid var(--linea); color:#1a1f2b;
  }
  table.mov td.fecha{ color:var(--azul); font-weight:700; }
  table.mov td.num{ text-align:right; font-weight:700; }
  table.mov td.num.pos{ color:var(--verde); }
  table.mov td.num.neg{ color:var(--rojo); }
  table.mov td.num.zero{ color:#c3cad9; font-weight:500; }
  table.mov tbody tr:nth-child(even){ background:#fafbfd; }

  /* Pantalla de bloqueo (PIN) */
  #lock-screen{
    position:fixed; inset:0; z-index:100;
    background:var(--azul-osc);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #lock-screen.hidden{ display:none; }
  .lock-box{
    width:100%; max-width:320px; text-align:center;
  }
  .lock-box .lock-logo{
    width:64px; height:64px; border-radius:16px;
    background:var(--azul); color:#fff; font-weight:800; font-size:22px;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px;
  }
  .lock-box h2{
    color:#fff; font-size:19px; margin:0 0 4px; font-weight:800;
  }
  .lock-box p{
    color:#a9b8d6; font-size:14px; margin:0 0 22px;
  }
  .lock-box input{
    width:100%; padding:14px 16px; border-radius:12px; border:none;
    font-size:20px; text-align:center; letter-spacing:4px;
    outline:none; margin-bottom:14px;
  }
  .lock-box button{
    width:100%; padding:13px; border-radius:12px; border:none;
    background:#fff; color:var(--azul-osc); font-weight:800; font-size:16px;
    cursor:pointer;
  }
  .lock-box button:active{ opacity:0.85; }
  .lock-box .lock-error{
    color:#ff8a80; font-size:13px; margin-top:12px; min-height:16px;
  }

  /* Modal de confirmación (cerrar sesión) */
  #confirm-modal{
    position:fixed; inset:0; z-index:200;
    background:rgba(17,22,36,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #confirm-modal.hidden{ display:none; }
  .confirm-box{
    width:100%; max-width:320px;
    background:#fff; border-radius:18px;
    padding:26px 22px 20px;
    text-align:center;
    box-shadow:0 12px 30px rgba(17,22,36,0.25);
  }
  .confirm-box .confirm-icon{
    width:52px; height:52px; border-radius:50%;
    background:#fdecea; color:var(--rojo);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
  }
  .confirm-box .confirm-icon svg{ width:24px; height:24px; }
  .confirm-box h3{
    font-size:17px; margin:0 0 6px; color:#111624; font-weight:800;
  }
  .confirm-box p{
    font-size:14px; color:var(--texto-tenue); margin:0 0 20px; line-height:1.4;
  }
  .confirm-box .confirm-actions{
    display:flex; gap:10px;
  }
  .confirm-box button{
    flex:1; padding:12px; border-radius:12px; border:none;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .confirm-box .btn-cancelar{
    background:var(--azul-suave); color:var(--azul-osc);
  }
  .confirm-box .btn-cancelar:active{ background:var(--azul-borde); }
  .confirm-box .btn-confirmar{
    background:var(--rojo); color:#fff;
  }
  .confirm-box .btn-confirmar:active{ opacity:0.85; }

  /* Botón flotante (+) para nuevo movimiento */
  .fab{
    position:fixed; bottom:28px;
    right:max(22px, calc((100vw - 520px) / 2 + 22px));
    width:56px; height:56px; border-radius:50%;
    background:var(--azul); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(42,92,201,0.45);
    cursor:pointer; z-index:50;
  }
  .fab.hidden{ display:none; }
  .fab svg{ width:26px; height:26px; }
  .fab:active{ transform:scale(0.94); }

  /* Modal Nuevo Movimiento */
  #nuevo-modal{
    position:fixed; inset:0; z-index:150;
    background:rgba(17,22,36,0.55);
    display:flex; align-items:flex-end; justify-content:center;
  }
  #nuevo-modal.hidden{ display:none; }
  .nuevo-box{
    width:100%; max-width:520px; max-height:88vh;
    background:#fff; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -8px 24px rgba(17,22,36,0.25);
  }
  .nuevo-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; border-bottom:1px solid var(--linea); flex-shrink:0;
  }
  .nuevo-header h3{ margin:0; font-size:18px; font-weight:800; color:#111624; }
  .nuevo-close{
    background:var(--azul-suave); border:none; color:var(--azul-osc);
    width:30px; height:30px; border-radius:50%; font-size:18px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .nuevo-body{
    padding:16px 20px; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nuevo-body label{
    display:block; font-size:13px; font-weight:700; color:var(--azul-osc);
    margin:14px 0 6px;
  }
  .nuevo-body label:first-child{ margin-top:0; }
  .nuevo-body input[type="text"],
  .nuevo-body input[type="date"]{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--azul-borde);
    font-size:16px; outline:none; color:#1a1f2b; background:#fff;
  }
  .nuevo-body input:focus{ border-color:var(--azul); }

  /* Botones de Sección */
  .nm-seccion-grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
  }
  .nm-seccion-btn{
    padding:12px 8px; border-radius:11px; border:1.5px solid var(--azul-borde);
    background:#fff; color:#3a4560; font-size:14.5px; font-weight:700;
    cursor:pointer; text-align:center;
  }
  .nm-seccion-btn.selected{
    background:var(--azul); border-color:var(--azul); color:#fff;
    box-shadow:0 2px 6px rgba(42,92,201,0.35);
  }
  .nm-seccion-btn:active{ opacity:0.85; }
  .nuevo-productos-title{
    font-size:13px; font-weight:800; color:var(--azul-osc);
    margin:20px 0 8px; padding-top:14px; border-top:1px solid var(--linea);
  }
  .nuevo-productos-grid{
    display:grid; gap:10px;
  }
  .nuevo-productos-grid.principales{
    grid-template-columns:1fr 1fr;
    margin-bottom:10px;
  }
  .nuevo-productos-grid.resto{
    grid-template-columns:1fr 1fr 1fr;
  }
  .nuevo-prod-item{
    background:#fdfbf3; border:1px solid #ece4c8; border-radius:14px;
    padding:12px 8px 11px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .nuevo-prod-item label{
    font-size:12.5px; font-weight:800; color:#1a1f2b;
    margin:0 0 8px; line-height:1.25;
  }
  .nuevo-prod-item input{
    width:100%; padding:8px 4px; border-radius:9px; border:1px solid var(--azul-borde);
    font-size:15px; outline:none; color:var(--azul); font-weight:700;
    text-align:center; background:#fff;
  }
  .nuevo-prod-item input:focus{ border-color:var(--azul); }
  .nuevo-prod-item input::placeholder{ color:#b7c0d4; font-weight:500; }
  .nuevo-footer{
    display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--linea);
    flex-shrink:0; background:#fff;
  }
  .nuevo-footer button{
    flex:1; padding:13px; border-radius:12px; border:none;
    font-size:15px; font-weight:800; cursor:pointer;
  }
  .nuevo-footer .btn-cancelar{ background:var(--azul-suave); color:var(--azul-osc); }
  .nuevo-footer .btn-cancelar:active{ background:var(--azul-borde); }
  .nuevo-footer .btn-guardar{ background:var(--azul); color:#fff; }
  .nuevo-footer .btn-guardar:active{ opacity:0.88; }
  .nuevo-footer .btn-guardar:disabled{ opacity:0.6; }
  .nuevo-error{
    color:var(--rojo); font-size:13px; text-align:center; padding:0 20px 4px;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-logo">DP</div>
    <h2>Acceso restringido</h2>
    <p>Ingresá el PIN para entrar</p>
    <input type="password" id="lock-input" inputmode="numeric" placeholder="••••" autocomplete="off">
    <button id="lock-btn">Ingresar</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<div id="confirm-modal" class="hidden">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h3>Cerrar sesión</h3>
    <p>Vas a tener que ingresar el PIN de nuevo para volver a entrar en este celular.</p>
    <div class="confirm-actions">
      <button class="btn-cancelar" id="confirm-cancelar">Cancelar</button>
      <button class="btn-confirmar" id="confirm-aceptar">Cerrar sesión</button>
    </div>
  </div>
</div>

<button id="fab-nuevo" class="fab hidden" aria-label="Nuevo movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div id="nuevo-modal" class="hidden">
  <div class="nuevo-box">
    <div class="nuevo-header">
      <h3>Nuevo movimiento</h3>
      <button class="nuevo-close" id="nuevo-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="nuevo-body">
      <label>Sección</label>
      <div class="nm-seccion-grid" id="nm-seccion-grid"></div>
      <input type="hidden" id="nm-seccion">
	  
	  <label>Fecha</label>
      <input type="date" id="nm-fecha">

      <label>Concepto</label>
      <input type="text" id="nm-concepto" placeholder="Ej: Indavisa, Venta, 1A, 2A, 3A">

      <label>Notas</label>
      <input type="text" id="nm-notas" placeholder="Opcional">

      <label>Usuario</label>
      <input type="text" id="nm-usuario" placeholder="Tu nombre">      

      <div class="nuevo-productos-title">Productos</div>
      <div class="nuevo-productos-grid principales" id="nm-productos-principales"></div>
      <div class="nuevo-productos-grid resto" id="nm-productos-resto"></div>
    </div>
    <div class="nuevo-error" id="nuevo-error"></div>
    <div class="nuevo-footer">
      <button class="btn-cancelar" id="nuevo-cancelar-btn">Cancelar</button>
      <button class="btn-guardar" id="nuevo-guardar">Guardar</button>
    </div>
  </div>
</div>

<div id="app">

  <header>
    <div class="top-row">
      <div>
        <h1 id="header-title">Stock</h1>
        <div class="sub">Distribuidora Don Picconi</div>
      </div>
      <div style="display:flex; gap:22px;">
        <button class="icon-btn" id="btn-refresh" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="icon-btn logout" id="btn-logout" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="pill-tabs">
    <button id="tab-stock" data-tab="stock" class="active">Stock Actual</button>
    <button id="tab-mov" data-tab="movimientos">Movimientos</button>
  </div>


  <div class="search-wrap" id="search-wrap">
    <input type="text" id="search" placeholder="Buscar producto...">
  </div>

  <main id="main">
    <div class="state-msg" id="loading">Cargando datos...</div>
  </main>

</div>

<script>
/* ============== CONFIGURACIÓN ============== */
const CONFIG = {
  // Pegá acá la URL de tu Web App de Apps Script (termina en /exec)
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxV-3ozAFkPJ5WvutB-lpZDOQe-tFmDAmjzqSACmgeAzm4tIclFBOgN72zhooPha_LDeQ/exec',

  // PIN/clave para entrar a la app. Cambialo por el que quieras usar.
  PIN: '4508',

  // Nombre EXACTO de la columna de fecha a usar para ordenar / mostrar
  CAMPO_FECHA: 'Fecha',

  // Columnas de producto, en el orden en que querés que aparezcan
  PRODUCTOS: [
    'Cajones de Pollo', 'Unidades de Pollo', 'Cuarto', 'Filet de Muslo',
    'Ala', 'Pechuga', 'Pechuga B', 'Pechuguín', 'Menudo', 'Molida',
    'Carcaza', 'Medallones', 'Formitas', 'Tiritas'
  ]
};
/* ============================================= */

let movimientos = [];
let currentTab = 'stock';

const mainEl = document.getElementById('main');
const searchEl = document.getElementById('search');
const searchWrapEl = document.getElementById('search-wrap');
const headerTitle = document.getElementById('header-title');
const btnRefresh = document.getElementById('btn-refresh');
const appEl = document.getElementById('app');

function formatFecha(valor){
  if(!valor) return '-';
  const d = new Date(valor);
  if(isNaN(d)) return String(valor);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function formatNum(n){
  return Number(n || 0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ============== Bloqueo con PIN ============== */
const AUTH_KEY = 'dp_stock_auth_ok';
const lockScreen = document.getElementById('lock-screen');
const lockInput = document.getElementById('lock-input');
const lockBtn = document.getElementById('lock-btn');
const lockError = document.getElementById('lock-error');

function intentarDesbloquear(){
  if(lockInput.value === CONFIG.PIN){
    localStorage.setItem(AUTH_KEY, 'ok');
    lockScreen.classList.add('hidden');
    cargarDatos();
  }else{
    lockError.textContent = 'PIN incorrecto';
    lockInput.value = '';
    lockInput.focus();
  }
}

lockBtn.addEventListener('click', intentarDesbloquear);
lockInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') intentarDesbloquear();
});

document.getElementById('btn-logout').addEventListener('click', () => {
  document.getElementById('confirm-modal').classList.remove('hidden');
});

document.getElementById('confirm-cancelar').addEventListener('click', () => {
  document.getElementById('confirm-modal').classList.add('hidden');
});

document.getElementById('confirm-aceptar').addEventListener('click', () => {
  document.getElementById('confirm-modal').classList.add('hidden');
  localStorage.removeItem(AUTH_KEY);
  lockInput.value = '';
  lockError.textContent = '';
  lockScreen.classList.remove('hidden');
  lockInput.focus();
});

window.addEventListener('load', function(){
  if(localStorage.getItem(AUTH_KEY) === 'ok'){
    lockScreen.classList.add('hidden');
    cargarDatos();
  }else{
    lockInput.focus();
  }
});
/* =============================================== */

async function cargarDatos(){
  btnRefresh.classList.add('spinning');
  try{
    const resp = await fetch(CONFIG.APPS_SCRIPT_URL, {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if(data && data.error){
      movimientos = [];
      mainEl.innerHTML = `<div class="state-msg error">No se pudieron cargar los datos: ${data.error}</div>`;
      return;
    }
    movimientos = data;
    render();
  }catch(err){
    mainEl.innerHTML = `<div class="state-msg error">No se pudo cargar el Google Sheet.<br>${err.message}<br><br>Revisá que CONFIG.APPS_SCRIPT_URL esté bien configurada.</div>`;
  }finally{
    btnRefresh.classList.remove('spinning');
  }
}

function calcularStock(){
  const stock = {};
  CONFIG.PRODUCTOS.forEach(p => stock[p] = {total:0, ultimaFecha:null});

  movimientos.forEach(mov => {
    CONFIG.PRODUCTOS.forEach(p => {
      const cant = parseFloat(mov[p]);
      if(!isNaN(cant) && cant !== 0){
        stock[p].total += cant;
        const f = new Date(mov[CONFIG.CAMPO_FECHA]);
        if(!isNaN(f) && (!stock[p].ultimaFecha || f > stock[p].ultimaFecha)){
          stock[p].ultimaFecha = f;
        }
      }
    });
  });
  return stock;
}

function renderStock(filtro){
  const stock = calcularStock();
  const filas = CONFIG.PRODUCTOS
    .filter(p => !filtro || p.toLowerCase().includes(filtro.toLowerCase()))
    .filter(p => Math.round((stock[p].total + Number.EPSILON) * 100) / 100 !== 0)
    .map(p => {
      const s = stock[p];
      return `<tr>
        <td class="prod">${p}</td>
        <td class="stock">${formatNum(s.total)}</td>
        <td class="fecha">${s.ultimaFecha ? formatFecha(s.ultimaFecha) : '-'}</td>
      </tr>`;
    }).join('');

  if(!filas){
    mainEl.innerHTML = `<div class="state-msg">Sin productos que coincidan.</div>`;
    return;
  }

  mainEl.innerHTML = `
    <div class="stock-table-wrap">
      <table class="stock">
        <thead>
          <tr>
            <th class="prod">Producto</th>
            <th class="stock">Cantidad</th>
            <th class="fecha">Fecha</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

function renderMovimientos(filtro){
  const ordenados = [...movimientos].sort((a,b) => new Date(a[CONFIG.CAMPO_FECHA]) - new Date(b[CONFIG.CAMPO_FECHA]));

  // columnas de producto a mostrar: si hay filtro, solo las que matchean; si no, todas
  const productosVisibles = CONFIG.PRODUCTOS.filter(p =>
    !filtro || p.toLowerCase().includes(filtro.toLowerCase())
  );

  const filas = ordenados
    .filter(mov => {
      if(!filtro) return true;
      // coincide si el filtro matchea un producto con movimiento en esa fila,
      // o si matchea el concepto/sección/notas
      const matchProducto = CONFIG.PRODUCTOS.some(p => p.toLowerCase().includes(filtro.toLowerCase()) && parseFloat(mov[p]));
      const texto = `${mov['Concepto']||''} ${mov['Sección']||''} ${mov['Notas']||''} ${mov['Usuario']||''}`.toLowerCase();
      return matchProducto || texto.includes(filtro.toLowerCase());
    })
    .map(mov => {
      const celdasProducto = productosVisibles.map(p => {
        const val = parseFloat(mov[p]);
        if(!val) return `<td class="num zero">-</td>`;
        const cls = val >= 0 ? 'pos' : 'neg';
        const signo = val >= 0 ? '+' : '';
        return `<td class="num ${cls}">${signo}${formatNum(val)}</td>`;
      }).join('');

      return `<tr>
        <td class="fecha">${formatFecha(mov[CONFIG.CAMPO_FECHA])}</td>
        <td>${mov['Sección'] || '-'}</td>
        <td>${mov['Concepto'] || '-'}</td>
        <td>${mov['Notas'] || '-'}</td>
        <td>${mov['Usuario'] || '-'}</td>
        ${celdasProducto}
      </tr>`;
    }).join('');

  if(!filas){
    mainEl.innerHTML = `<div class="state-msg">Sin movimientos que coincidan.</div>`;
    return;
  }

  const headerProductos = productosVisibles.map(p => `<th>${p}</th>`).join('');

  mainEl.innerHTML = `
    <div class="mov-table-wrap">
      <div class="mov-scroll" id="mov-scroll">
        <table class="mov">
          <thead>
            <tr>
              <th>Fecha</th><th>Sección</th><th>Concepto</th><th>Notas</th><th>Usuario</th>
              ${headerProductos}
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>`;
}

// Guarda la posición de scroll de cada pestaña para restaurarla al volver
const scrollState = {
  stock: 0,
  movimientos: { top: 0, left: 0 }
};

function guardarScrollActual(){
  if(currentTab === 'stock'){
    scrollState.stock = mainEl.scrollTop;
  }else{
    const movScroll = document.getElementById('mov-scroll');
    if(movScroll){
      scrollState.movimientos.top = movScroll.scrollTop;
      scrollState.movimientos.left = movScroll.scrollLeft;
    }
  }
}

function restaurarScroll(){
  if(currentTab === 'stock'){
    mainEl.scrollTop = scrollState.stock;
  }else{
    const movScroll = document.getElementById('mov-scroll');
    if(movScroll){
      movScroll.scrollTop = scrollState.movimientos.top;
      movScroll.scrollLeft = scrollState.movimientos.left;
    }
  }
}

function render(){
  searchWrapEl.style.display = currentTab === 'movimientos' ? 'block' : 'none';
  const filtro = currentTab === 'movimientos' ? searchEl.value.trim() : '';
  mainEl.classList.toggle('grid-mode', currentTab === 'movimientos');
  if(currentTab === 'stock'){
    headerTitle.textContent = 'Stock';
    renderStock(filtro);
  }else{
    headerTitle.textContent = 'Movimientos';
    renderMovimientos(filtro);
  }
  restaurarScroll();
}

function setTab(tab){
  if(tab === currentTab) return;
  guardarScrollActual();
  currentTab = tab;
  document.getElementById('tab-stock').classList.toggle('active', tab === 'stock');
  document.getElementById('tab-mov').classList.toggle('active', tab === 'movimientos');
  fabNuevo.classList.toggle('hidden', tab !== 'movimientos');
  render();
}

document.getElementById('tab-stock').addEventListener('click', () => setTab('stock'));
document.getElementById('tab-mov').addEventListener('click', () => setTab('movimientos'));
btnRefresh.addEventListener('click', cargarDatos);
searchEl.addEventListener('input', () => {
  // al filtrar, arrancamos la vista de nuevo desde arriba
  scrollState.stock = 0;
  scrollState.movimientos = { top: 0, left: 0 };
  render();
});

/* ============== Nuevo movimiento ============== */
const USUARIO_KEY = 'dp_stock_usuario';
const SECCIONES = ['Compras', 'Granja', 'Repartos', 'Trozado', 'Ajustes', 'Otros'];
const fabNuevo = document.getElementById('fab-nuevo');
const nuevoModal = document.getElementById('nuevo-modal');
const nmProductosPrincipales = document.getElementById('nm-productos-principales');
const nmProductosResto = document.getElementById('nm-productos-resto');
const nmSeccionGrid = document.getElementById('nm-seccion-grid');
const nmSeccion = document.getElementById('nm-seccion');
const nmConcepto = document.getElementById('nm-concepto');
const nmNotas = document.getElementById('nm-notas');
const nmUsuario = document.getElementById('nm-usuario');
const nmFecha = document.getElementById('nm-fecha');
const nuevoError = document.getElementById('nuevo-error');
const btnGuardar = document.getElementById('nuevo-guardar');

// generar un input por producto: los 2 primeros en la grilla grande, el resto de a 3
function itemProductoHTML(p, i){
  return `
    <div class="nuevo-prod-item">
      <label for="nm-prod-${i}">${p}</label>
      <input type="text" inputmode="decimal" id="nm-prod-${i}" data-producto="${p}" placeholder="0" class="nm-prod-input">
    </div>`;
}
nmProductosPrincipales.innerHTML = CONFIG.PRODUCTOS.slice(0, 2)
  .map((p, i) => itemProductoHTML(p, i)).join('');
nmProductosResto.innerHTML = CONFIG.PRODUCTOS.slice(2)
  .map((p, i) => itemProductoHTML(p, i + 2)).join('');

// Formateo en vivo de los campos de cantidad: separador de miles dinámico,
// coma como separador decimal, y máximo 4 dígitos en la parte entera.
function formatearCantidad(valorCrudo){
  const negativo = valorCrudo.trim().startsWith('-');

  // dejar solo dígitos y comas
  let limpio = valorCrudo.replace(/[^0-9,]/g, '');

  // quedarnos solo con la primera coma (separador decimal)
  const idxComa = limpio.indexOf(',');
  let entero = idxComa === -1 ? limpio : limpio.slice(0, idxComa);
  let decimal = idxComa === -1 ? null : limpio.slice(idxComa + 1).replace(/,/g, '');

  // máximo 4 dígitos en la parte entera (sin contar la parte decimal)
  entero = entero.slice(0, 4);

  // separador de miles dinámico (punto)
  const enteroConPuntos = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  let resultado = (negativo ? '-' : '') + enteroConPuntos;
  if(decimal !== null) resultado += ',' + decimal;

  return resultado;
}

document.querySelectorAll('.nm-prod-input').forEach(inp => {
  inp.addEventListener('input', () => {
    inp.value = formatearCantidad(inp.value);
  });
});

// Antes de enviar: quita los puntos de miles y deja el número limpio
// (la coma decimal se convierte a punto del lado del Apps Script).
function limpiarCantidadParaEnvio(valorFormateado){
  return valorFormateado.replace(/\./g, '');
}

// generar los botones de Sección, una sola vez
nmSeccionGrid.innerHTML = SECCIONES.map(s => `
  <button type="button" class="nm-seccion-btn" data-seccion="${s}">${s}</button>
`).join('');

function seleccionarSeccion(valor){
  nmSeccion.value = valor;
  nmSeccionGrid.querySelectorAll('.nm-seccion-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.seccion === valor);
  });
}

nmSeccionGrid.querySelectorAll('.nm-seccion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    // tocar de nuevo el mismo botón lo deselecciona
    seleccionarSeccion(nmSeccion.value === btn.dataset.seccion ? '' : btn.dataset.seccion);
  });
});

function abrirNuevoModal(){
  seleccionarSeccion('');
  nmConcepto.value = '';
  nmNotas.value = '';
  nmUsuario.value = localStorage.getItem(USUARIO_KEY) || '';
  nmFecha.value = new Date().toISOString().slice(0,10);
  nmProductosPrincipales.querySelectorAll('input').forEach(inp => inp.value = '');
  nmProductosResto.querySelectorAll('input').forEach(inp => inp.value = '');
  nuevoError.textContent = '';
  btnGuardar.disabled = false;
  btnGuardar.textContent = 'Guardar';
  nuevoModal.classList.remove('hidden');
}

function cerrarNuevoModal(){
  nuevoModal.classList.add('hidden');
}

fabNuevo.addEventListener('click', abrirNuevoModal);
document.getElementById('nuevo-cerrar').addEventListener('click', cerrarNuevoModal);
document.getElementById('nuevo-cancelar-btn').addEventListener('click', cerrarNuevoModal);

btnGuardar.addEventListener('click', async () => {
  nuevoError.textContent = '';

  const seccion = nmSeccion.value.trim();
  const concepto = nmConcepto.value.trim();

  if(!seccion && !concepto){
    nuevoError.textContent = 'Completá al menos Sección o Concepto.';
    return;
  }

  const productos = {};
  let hayCantidad = false;
  document.querySelectorAll('#nm-productos-principales input, #nm-productos-resto input').forEach(inp => {
    const val = inp.value.trim();
    if(val !== ''){
      productos[inp.dataset.producto] = limpiarCantidadParaEnvio(val);
      hayCantidad = true;
    }
  });

  if(!hayCantidad){
    nuevoError.textContent = 'Cargá al menos la cantidad de un producto.';
    return;
  }

  const usuario = nmUsuario.value.trim();
  if(usuario) localStorage.setItem(USUARIO_KEY, usuario);

  const payload = {
    seccion, concepto,
    notas: nmNotas.value.trim(),
    usuario,
    fecha: nmFecha.value,
    productos
  };

  btnGuardar.disabled = true;
  btnGuardar.textContent = 'Guardando...';

  try{
    const resp = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if(data && data.error) throw new Error(data.error);

    cerrarNuevoModal();
    await cargarDatos();
  }catch(err){
    nuevoError.textContent = 'No se pudo guardar: ' + err.message;
  }finally{
    btnGuardar.disabled = false;
    btnGuardar.textContent = 'Guardar';
  }
});
/* =================================================== */

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('No se pudo registrar el Service Worker:', err);
    });
  });
}
